name: Continuous Integration

on:
  - push
  - pull_request

env:
  SEVENZIP_VERSION: '2604'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: ['', '--prefer-lowest']
        p7zip: ['7zip']
        include:
          - os: 'windows-latest'
            php: '8.5'
          - os: 'macos-latest'
            php: '8.5'
          - os: 'ubuntu-latest'
            php: '8.5'
            p7zip: 'p7zip'

    name: ${{ matrix.os }}; PHP ${{ matrix.php }}; ${{ matrix.deps && 'lowest' || 'latest' }}-deps; ${{ matrix.p7zip }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup p7zip Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.p7zip == 'p7zip' }}
        run: sudo apt install p7zip-full p7zip-rar
      - name: Setup 7zip Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.p7zip == '7zip' }}
        run: |
          curl -L https://7-zip.org/a/7z${{ env.SEVENZIP_VERSION }}-linux-x64.tar.xz > 7z-linux-x64.tar.xz
          tar xJvf 7z-linux-x64.tar.xz
          sudo cp 7zz /usr/bin/7zz
      - name: Setup 7zip MacOs
        if: matrix.os == 'macos-latest'
        run: |
          curl -L https://7-zip.org/a/7z${{ env.SEVENZIP_VERSION }}-mac.tar.xz > 7z-mac.tar.xz
          tar xJvf 7z-mac.tar.xz
          sudo cp 7zz /usr/local/bin/7zz
      # windows-latest already ships 7-Zip at C:\Program Files\7-Zip\7z.exe (the auto-detect path).

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            composer update --optimize-autoloader --no-interaction --ansi --no-progress --prefer-dist ${{ matrix.deps }}
            composer info -D

      - name: Tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  known-issues:
    name: Known issues (expected failures)
    # Expected failures are kept visible in their own, non-blocking check so a
    # regression in the default suite is never confused with a known limitation.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup 7zip Ubuntu
        run: |
          curl -L https://7-zip.org/a/7z${{ env.SEVENZIP_VERSION }}-linux-x64.tar.xz > 7z-linux-x64.tar.xz
          tar xJvf 7z-linux-x64.tar.xz
          sudo cp 7zz /usr/bin/7zz

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            composer update --optimize-autoloader --no-interaction --ansi --no-progress --prefer-dist
            composer info -D

      - name: Known issues
        run: vendor/bin/phpunit --testsuite KnownIssues
