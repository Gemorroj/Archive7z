name: Continuous Integration

on:
  - push
  - pull_request

env:
  SEVENZIP_URL: 'https://github.com/ip7z/7zip/releases/download/26.05/7z2605'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: ['', '--prefer-lowest']
        sevenzip: ['official']
        include:
          - os: 'windows-latest'
            php: '8.5'
            sevenzip: 'bundled'
          - os: 'macos-latest'
            php: '8.5'
            sevenzip: 'official'
          - os: 'ubuntu-latest'
            php: '8.5'
            sevenzip: 'distro'

    name: ${{ matrix.os }}; PHP ${{ matrix.php }}; ${{ matrix.deps && 'lowest' || 'latest' }}-deps; 7-Zip ${{ matrix.sevenzip }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup 7-Zip (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          if [ '${{ matrix.sevenzip }}' = 'distro' ]; then
            sudo apt-get update
            sudo apt-get install -y 7zip 7zip-rar
          else
            curl -fL -o 7z.tar.xz "${{ env.SEVENZIP_URL }}-linux-x64.tar.xz"
            tar xJf 7z.tar.xz
            sudo cp 7zz /usr/bin/7zz
          fi
      - name: Setup 7-Zip (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          curl -fL -o 7z.tar.xz "${{ env.SEVENZIP_URL }}-mac.tar.xz"
          tar xJf 7z.tar.xz
          sudo cp 7zz /usr/local/bin/7zz
      # windows-latest already ships 7-Zip at C:\Program Files\7-Zip\7z.exe (the auto-detect path).

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            composer update --optimize-autoloader --no-interaction --ansi --no-progress --prefer-dist ${{ matrix.deps }}
            composer info -D

      - name: Tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
